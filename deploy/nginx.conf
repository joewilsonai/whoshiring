# The bare IP and anything else land on the real name, so old links keep working.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://whoshiring.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.whoshiring.app;
    ssl_certificate /etc/letsencrypt/live/whoshiring.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whoshiring.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://whoshiring.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whoshiring.app;
    ssl_certificate /etc/letsencrypt/live/whoshiring.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whoshiring.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/whoshiring;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
    location ~* \.json$ { add_header Cache-Control "public, max-age=300"; }
    location / { try_files $uri $uri/ =404; }
}
